providers: 
  webSearchOrder: 
    []
  memoryModel: online
modelRoles: 
  default: anthropic/claude-opus-5
  plan: anthropic/claude-opus-5:xhigh
  slow: anthropic/claude-opus-5:max
  task: anthropic/claude-sonnet-5
  smol: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low
  tiny: cursor/gpt-5.4-nano-low
  vision: cursor/gemini-3.1-pro
  advisor: openai-codex/gpt-5.6-terra:medium
modelProviderOrder: 
  - anthropic
  - openai-codex
  - cursor
  - openai
  - amazon-bedrock
symbolPreset: nerd
theme: 
  dark: dark-one
  light: light-one
setupVersion: 1
dev: 
  autoqaConsent: granted
statusLine: 
  preset: custom
  separator: slash
  showHookStatus: true
  compactThinkingLevel: true
  transparent: false
  sessionAccent: true
  leftSegments: 
    - pi
    - hostname
    - path
    - git
    - pr
  rightSegments: 
    - model
    - mode
    - subagents
    - cost
    - usage
    - context_pct
  segmentOptions: 
    model: 
      showThinkingLevel: false
    path: 
      abbreviate: true
      maxLength: 60
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time: 
      format: 24h
      showSeconds: true
terminal: 
  showProgress: true
tui: 
  textSizing: true
  codexResetFireworks: false
  tight: false
  scrollbackRebuild: true
  imeSafeCursor: false
display: 
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
task: 
  showResolvedModelBadge: true
  eager: preferred
personality: pragmatic
retry: 
  usageAwareFallback: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default: 
      - cursor/claude-opus-5-high
      - openai-codex/gpt-5.6-terra:high
      - openai/gpt-5.6:high
    plan: 
      - cursor/claude-opus-5-thinking-xhigh
      - openai-codex/gpt-5.6-terra:xhigh
      - openai/gpt-5.6:xhigh
    slow: 
      - cursor/claude-opus-5-thinking-max
      - openai-codex/gpt-5.6-terra:xhigh
      - openai/gpt-5.6:xhigh
    task: 
      - cursor/claude-sonnet-5-medium
      - openai-codex/gpt-5.6-terra:medium
      - openai/gpt-5.6-terra:medium
    smol: 
      - cursor/gpt-5.6-luna-low
      - anthropic/claude-haiku-4-5:low
      - openai/gpt-5.6-luna:low
    commit: 
      - cursor/gpt-5.6-luna-low
      - openai/gpt-5.6-luna:low
    tiny: 
      - openai-codex/gpt-5.4-mini:low
      - openai/gpt-5.4-nano:low
    vision: 
      - anthropic/claude-opus-5
      - openai/gpt-5.6:medium
    advisor: 
      - cursor/gpt-5.6-terra-medium
      - openai/gpt-5.6-terra:medium
interruptMode: immediate
followUpMode: all
steeringMode: all
loop: 
  mode: reset
doubleEscapeAction: tree
error: 
  notify: "on"
collab: 
  displayName: andyhite
marketplace: 
  autoUpdate: auto
startup: 
  changelogMode: summary
  quiet: true
features: 
  unexpectedStopDetection: true
compaction: 
  strategy: snapcompact
  handoffSaveToDisk: true
ttsr: 
  contextMode: discard
  repeatMode: after-gap
memory: 
  backend: mnemopi
autolearn: 
  enabled: true
mnemopi: 
  proactiveLinking: true
  enhancedRecall: true
  polyphonicRecall: true
edit: 
  mode: hashline
readLineNumbers: true
read: 
  renderMarkdown: true
  toolResultPreview: true
lsp: 
  formatOnWrite: false
bash: 
  autoBackground: 
    enabled: true
  direnv: auto
bashInterceptor: 
  enabled: true
astGrep: 
  enabled: true
computer: 
  enabled: true
checkpoint: 
  enabled: true
github: 
  enabled: true
web_search: 
  enabled: true
todo: 
  eager: preferred
browser: 
  relay: true
plan: 
  defaultOnStartup: false
commands: 
  enableClaudeUser: true
secrets: 
  enabled: true