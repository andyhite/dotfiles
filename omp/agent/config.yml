providers: 
  webSearchOrder: 
    []
  memoryModel: online
modelRoles: 
  # Primary driver — Claude subscription (OAuth), 1M ctx
  default: anthropic/claude-opus-5
  # Architecture / deep reasoning: same brain, more thinking
  plan: "anthropic/claude-opus-5:xhigh"
  slow: "anthropic/claude-opus-5:max"
  # Subagent workhorse — cheaper Claude, still 1M ctx
  task: anthropic/claude-sonnet-5
  # High-volume cheap roles live on the ChatGPT/Cursor subs so they
  # don't burn the Anthropic quota that `default` needs
  smol: "openai-codex/gpt-5.6-luna:low"
  commit: "openai-codex/gpt-5.6-luna:low"
  tiny: cursor/gpt-5.4-nano-low
  # Best-in-class image understanding, on the Cursor sub
  vision: cursor/gemini-3.1-pro
  # Cross-vendor turn reviewer (inert until advisor.enabled)
  advisor: "openai-codex/gpt-5.6-terra:medium"
# Disambiguates bare model ids shared across providers
modelProviderOrder: 
  - anthropic
  - openai-codex
  - cursor
  - openai
  - amazon-bedrock
symbolPreset: nerd
theme: 
  dark: dark-one
  light: light-one
setupVersion: 1
dev: 
  autoqaConsent: granted
statusLine: 
  preset: nerd
  separator: slash
terminal: 
  showProgress: true
tui: 
  textSizing: false
  codexResetFireworks: true
  tight: false
  scrollbackRebuild: true
  imeSafeCursor: false
display: 
  shimmer: classic
  showTokenUsage: true
task: 
  showResolvedModelBadge: true
  eager: preferred
personality: pragmatic
retry: 
  usageAwareFallback: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  # Ordering principle: subscription-backed providers first
  # (anthropic OAuth -> cursor -> openai-codex), metered `openai`
  # API key last. amazon-bedrock is omitted: its SSO token is expired.
  fallbackChains: 
    default: 
      - cursor/claude-opus-5-high
      - "openai-codex/gpt-5.6-terra:high"
      - "openai/gpt-5.6:high"
    plan: 
      - cursor/claude-opus-5-thinking-xhigh
      - "openai-codex/gpt-5.6-terra:xhigh"
      - "openai/gpt-5.6:xhigh"
    slow: 
      - cursor/claude-opus-5-thinking-max
      - "openai-codex/gpt-5.6-terra:xhigh"
      - "openai/gpt-5.6:xhigh"
    task: 
      - cursor/claude-sonnet-5-medium
      - "openai-codex/gpt-5.6-terra:medium"
      - "openai/gpt-5.6-terra:medium"
    smol: 
      - cursor/gpt-5.6-luna-low
      - "anthropic/claude-haiku-4-5:low"
      - "openai/gpt-5.6-luna:low"
    commit: 
      - cursor/gpt-5.6-luna-low
      - "openai/gpt-5.6-luna:low"
    tiny: 
      - "openai-codex/gpt-5.4-mini:low"
      - "openai/gpt-5.4-nano:low"
    vision: 
      - anthropic/claude-opus-5
      - "openai/gpt-5.6:medium"
    advisor: 
      - cursor/gpt-5.6-terra-medium
      - "openai/gpt-5.6-terra:medium"
interruptMode: immediate
followUpMode: all
steeringMode: all
loop: 
  mode: reset
doubleEscapeAction: tree
error: 
  notify: "on"
collab: 
  displayName: andyhite
marketplace: 
  autoUpdate: auto
startup: 
  changelogMode: summary
features: 
  unexpectedStopDetection: true
compaction: 
  strategy: snapcompact
  handoffSaveToDisk: true
ttsr: 
  contextMode: discard
  repeatMode: after-gap
memory: 
  backend: mnemopi
autolearn: 
  enabled: true
mnemopi: 
  proactiveLinking: true
  enhancedRecall: true
  polyphonicRecall: true
edit: 
  mode: hashline
readLineNumbers: true
read: 
  renderMarkdown: true
  toolResultPreview: true
lsp: 
  formatOnWrite: false
bash: 
  autoBackground: 
    enabled: true
  direnv: auto
bashInterceptor: 
  enabled: true
astGrep: 
  enabled: true
computer: 
  enabled: true
checkpoint: 
  enabled: true
github: 
  enabled: true
web_search: 
  enabled: true
todo: 
  eager: preferred
browser: 
  relay: true
plan: 
  defaultOnStartup: false
commands: 
  enableClaudeUser: true
secrets: 
  enabled: true