providers:
  webSearchOrder:
    []
  memoryModel: online
  maxInFlightRequests:
    openai-codex: 8
modelRoles:
  default: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-opus-5:high
  slow: anthropic/claude-opus-5:max
  task: anthropic/claude-sonnet-5:low
  smol: anthropic/claude-haiku-4-5:low
  commit: anthropic/claude-haiku-4-5:minimal
  tiny: anthropic/claude-haiku-4-5:minimal
  vision: anthropic/claude-sonnet-5:medium
  designer: anthropic/claude-opus-5:high
  advisor: anthropic/claude-sonnet-5:medium
modelProviderOrder:
  - anthropic
  - openai-codex
  - anthropic-api
  - openai
  - cursor
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
  - codex
  - claude
  - cursor
  - gemini
symbolPreset: nerd
theme:
  dark: dark-one-tuned
  light: light-one
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: custom
  separator: slash
  showHookStatus: true
  compactThinkingLevel: true
  transparent: true
  sessionAccent: true
  leftSegments:
    - pi
    - hostname
    - path
    - git
    - pr
  rightSegments:
    - model
    - mode
    - subagents
    - cost
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
terminal:
  showProgress: true
tui:
  textSizing: true
  codexResetFireworks: false
  tight: false
  scrollbackRebuild: true
  imeSafeCursor: false
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
task:
  showResolvedModelBadge: true
  eager: preferred
personality: none
retry:
  usageAwareFallback: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic-api/claude-sonnet-5
      - openai/gpt-5.6-terra:medium
      - cursor/composer-2.5
    plan:
      - openai-codex/gpt-5.6-sol:high
      - anthropic-api/claude-opus-5:high
      - openai/gpt-5.6:high
      - cursor/composer-2.5
    slow:
      - openai-codex/gpt-5.6-sol:xhigh
      - anthropic-api/claude-opus-5:max
      - openai/gpt-5.6-sol:xhigh
      - cursor/composer-2.5
    task:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic-api/claude-sonnet-5
      - openai/gpt-5.6-terra:medium
      - cursor/composer-2.5
    smol:
      - openai-codex/gpt-5.6-luna:low
      - anthropic-api/claude-haiku-4-5
      - openai/gpt-5.6-luna:low
      - cursor/composer-2.5
    commit:
      - openai-codex/gpt-5.4-mini:minimal
      - anthropic-api/claude-haiku-4-5:minimal
      - openai/gpt-5.4-mini:minimal
      - cursor/composer-2.5
    tiny:
      - openai-codex/gpt-5.4-mini:minimal
      - anthropic-api/claude-haiku-4-5:minimal
      - openai/gpt-5.4-mini:minimal
      - cursor/composer-2.5
    vision:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic-api/claude-sonnet-5
      - openai/gpt-5.6-terra:medium
    designer:
      - openai-codex/gpt-5.6-sol:high
      - anthropic-api/claude-opus-5:high
      - openai/gpt-5.6-sol:high
      - cursor/composer-2.5
    advisor:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic-api/claude-sonnet-5
      - openai/gpt-5.6-terra:medium
      - cursor/composer-2.5
  usageReservePolicy: auto
  usageReservePct: 25
advisor:
  enabled: false
interruptMode: immediate
followUpMode: all
steeringMode: all
loop:
  mode: reset
doubleEscapeAction: tree
error:
  notify: "on"
collab:
  displayName: andyhite
marketplace:
  autoUpdate: auto
startup:
  changelogMode: summary
  quiet: true
features:
  unexpectedStopDetection: smart
compaction:
  handoffSaveToDisk: true
  thresholdPercent: 40
  idleEnabled: true
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
  idleThresholdTokens: 200000
  idleTimeoutSeconds: 120
ttsr:
  contextMode: discard
  repeatMode: after-gap
memory:
  backend: "off"
autolearn:
  enabled: false
edit:
  mode: hashline
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
lsp:
  formatOnWrite: false
bash:
  autoBackground:
    enabled: true
  direnv: auto
bashInterceptor:
  enabled: true
astGrep:
  enabled: true
computer:
  enabled: true
debug:
  enabled: false
checkpoint:
  enabled: true
github:
  enabled: true
web_search:
  enabled: true
todo:
  eager: preferred
browser:
  relay: true
plan:
  defaultOnStartup: false
commands:
  enableClaudeUser: true
secrets:
  enabled: true
composer:
  shape: claude
disabledExtensions:
  []