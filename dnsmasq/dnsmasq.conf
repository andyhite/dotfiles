# Base dnsmasq config — safe to track, no machine-specific domains here.
#
# Binds to loopback only, on a high port so `brew services start dnsmasq`
# never needs root (macOS keeps its own resolver on port 53 regardless).
# Pair each wildcard domain you want resolved to 127.0.0.1 with an
# /etc/resolver/<domain> file naming this same port — see README's dnsmasq
# section for the exact steps.
listen-address=127.0.0.1
port=5453
bind-interfaces
no-resolv
no-hosts

# Machine-local domain -> 127.0.0.1 records live outside this repo, since
# they name real internal hostnames. install.sh's template loop creates this
# file from dnsmasq.local.conf.example the first time, so it always exists
# by the time dnsmasq actually starts.
conf-file=/opt/homebrew/etc/dnsmasq.local.conf
