# markdownlint config for both markdownlint-cli2 (`just fix-md`) and the
# nvim-lint "markdownlint" linter (config/nvim/lua/configs/lint.lua) — one
# rule set for both, not two configs drifting apart.

# AGENTS.md's own prose convention is a soft 95-column wrap, not a hard rule
# enforced by a linter — and README's link- and comment-heavy lines routinely
# exceed even that on purpose. MD013 has no auto-fix (line wrapping isn't safe
# to automate), so leaving it on reports hundreds of unfixable "errors" on
# every run and drowns any real finding.
MD013: false

# config/nvim/README.md is vendored from NvChad's starter and opens with a bold
# paragraph, not a heading. MD041 assumes every file opens with a top-level
# `#`, which that file has never followed and this repo has no reason to force.
MD041: false
