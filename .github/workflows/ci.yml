# chezmoi + mise own this repo's bootstrap now, not a bespoke install.sh, so
# what's worth checking on every push is that every template renders on both
# platforms this repo targets and that an apply is idempotent. Neither needs
# more than a throwaway destination directory — except the per-OS divergence
# a single Ubuntu runner can never exercise, which is what the darwin job is
# for.
name: CI

# Every branch, not just main: work here usually lands as a direct push, so a
# branch filter would mean the checks only ever ran after the fact. Runs are
# attached to the commit SHA, so a push run still reports on a pull request
# opened from that branch — a `pull_request:` trigger would only duplicate it.
on:
  push:
  workflow_dispatch:

jobs:
  # Justfile is the source of truth for what each check actually runs and
  # why — these steps just invoke it, kept separate so a failure still names
  # itself in the GitHub UI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      # Justfile recipes assume their dependencies are already on PATH and
      # install nothing themselves. gitleaks is pinned to the same version as
      # .pre-commit-config.yaml's hook rev, so CI and commit time can never
      # disagree about what counts as a leak.
      - name: Install lint dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # A typo in `via` would otherwise render an entry silently absent on
      # one platform rather than failing — see the `data` recipe in Justfile.
      - name: packages.yaml schema
        run: just data

      # Checks more than syntax: every prompt-driven template (gitconfig,
      # the work-identity overlay, the chezmoi config template itself) has
      # to render for both darwin and linux with no answers supplied.
      - name: Templates render on both platforms
        run: just templates

      # Every provisioning script renders and passes shellcheck for both
      # platforms — see the `scripts` recipe in Justfile.
      - name: Provisioning scripts render and lint
        run: just scripts

      - name: zsh syntax
        run: just zsh-syntax

      # Only a check on COMMITTED content catches the realistic leak (new
      # machine, clone, open a remote project in Zed, commit) — see the
      # `leakguard` recipe in Justfile.
      - name: No work identifiers in committed content
        run: just leakguard

      # The generic half of the secret gate — token-shaped secrets, which
      # leakguard's five-literal pattern can never catch. Runs in CI because
      # the pre-commit gitleaks hook is bypassable (--no-verify, web UI, a
      # machine whose hooks were never installed) — see the `gitleaks`
      # recipe in Justfile.
      - name: No token-shaped secrets in committed content
        run: just gitleaks

  # The half that would have caught a real bug: applies the whole tree into
  # a throwaway destination twice, then asserts individual targets exist at
  # the shape they're supposed to — a broken symlink target, a missing
  # create_private_ entry, or a target that flip-flops shows up here instead
  # of on a machine being set up for the first time.
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      # `just smoke` applies twice into its own throwaway destination and
      # asserts `chezmoi verify` is clean after the second run — it doesn't
      # assert individual target shapes, so those assertions stay here.
      - name: Idempotent apply
        run: just smoke

      - name: Assert target shapes on linux
        run: |
          dest="$(mktemp -d)"
          chezmoi apply --source "$PWD" --destination "$dest" \
            --exclude scripts,externals --force \
            --override-data '{"workName":"","workEmail":"","workGitDir":""}'

          test -f "$dest/.zshrc"
          test -f "$dest/.gitconfig"
          test -f "$dest/.omp/agent/config.yml"

          # Every create_private_ target must be a real file, not a symlink —
          # a symlink here would put machine-local credentials back inside
          # the repo.
          test -f "$dest/.zshrc.local" && test ! -L "$dest/.zshrc.local"
          test -f "$dest/.omp/agent/models.yml" && test ! -L "$dest/.omp/agent/models.yml"
          test -f "$dest/.omp/agent/config.local.yml" && test ! -L "$dest/.omp/agent/config.local.yml"

          # dstack is macOS-only now — neither its config tree nor the old
          # Linux systemd unit should exist on this platform.
          test ! -e "$dest/.dstack"
          test ! -e "$dest/.config/systemd"

          # The Darwin-only Library/ tree must not exist on this platform —
          # this is the check today's single-OS CI runner used to be unable
          # to do at all, now checked from the other side by the darwin job.
          test ! -e "$dest/Library"

  # A real macOS runner, replacing the stub-uname trick the old CI used to
  # fake Darwin on Ubuntu. Asserts the paths that only exist on macOS,
  # including dstack's config and LaunchAgent — dstack is darwin-only now.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Assert target shapes on darwin
        run: |
          dest="$(mktemp -d)"
          chezmoi apply --source "$PWD" --destination "$dest" \
            --exclude scripts,externals --force \
            --override-data '{"workName":"","workEmail":"","workGitDir":""}'

          test -e "$dest/Library/LaunchAgents/ai.dstack.server.plist"
          test -f "$dest/.dstack/server/config.yml" && test ! -L "$dest/.dstack/server/config.yml"
          test -L "$dest/Library/Application Support/lazygit/config.yml"
          test ! -e "$dest/.config/systemd"
