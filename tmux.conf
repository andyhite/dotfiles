# --- Terminal & color ---
# Correct $TERM inside tmux; enables italics/truecolor detection in TUIs
set -g default-terminal "tmux-256color"
# Advertise RGB truecolor to apps even though outer TERM is xterm-256color
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# --- Responsiveness (critical for pi/claude TUIs) ---
# Don't wait after Esc — makes Esc feel instant in TUIs/vim
set -s escape-time 10
# Pass through extended key sequences (shift+enter, ctrl+enter, etc.)
set -g extended-keys on
# Tell TUIs when the pane gains/loses focus (pi and claude use this)
set -g focus-events on
# Let apps emit raw escape sequences (images, notifications, prompts)
set -g allow-passthrough on

# --- Clipboard over SSH ---
# OSC 52: copy inside tmux lands in your local (Warp) clipboard
set -g set-clipboard on

# --- Mouse & scrollback ---
set -g mouse on
set -g history-limit 50000

# --- Quality of life ---
# Start windows/panes at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one closes
set -g renumber-windows on
# Resize to the smallest *active* client, not smallest attached one
setw -g aggressive-resize on
# Faster status refresh isn't needed; keep it cheap
set -g status-interval 5
# Bigger paste buffer stack
set -g buffer-limit 20

# --- SSH reconnect resilience ---
# Agent forwarding breaks silently otherwise: SSH_AUTH_SOCK isn't in the
# default update-environment list, so after a disconnect+reconnect, panes
# opened before the reconnect keep pointing at the now-dead forwarded
# agent socket (git/ssh calls just hang). This refreshes it for any new
# pane/window opened after reattach.
set -ga update-environment " SSH_AUTH_SOCK SSH_CONNECTION"
# If a pane predates the reconnect and needs the fresh socket immediately,
# run: eval $(tmux show-environment -s SSH_AUTH_SOCK)

# Keep a pane open after its process exits/crashes instead of closing it
# out from under you — you're relying on tmux surviving disconnects, so
# don't also lose the crash output
set -g remain-on-exit on

# Killing the current session (prefix+x on the last pane) switches to
# another session instead of detaching the client entirely
set -g detach-on-destroy off

# --- Status bar ---
# Default status-left-length (10) truncates any session name past 10 chars
# — every "plotroom-*" session collapsed to the identical "[plotroom-"
# prefix, hiding the one part that actually differs between them.
set -g status-left-length 40
# bg=default/fg=default inherit Warp's own theme instead of tmux's loud
# built-in green bar; "dim" makes it recede rather than compete for attention
set -g status-style "bg=default,fg=default,dim"
set -g status-left "#[fg=default,bold]#S#[fg=default,dim] "
# Host + clock, so you always know which VM this pane belongs to
set -g status-right "#[fg=default,dim]#h  %H:%M"

# --- Notifications: quiet, don't steal focus ---
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "config reloaded"

# --- Vim-style pane navigation ---
# prefix+h/j/k/l instead of prefix+arrow; -r lets you repeat without
# re-pressing prefix (within repeat-time, default 500ms)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# --- Session persistence (survives a killed/crashed server) ---
# resurrect: prefix+Ctrl-s save, prefix+Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum: autosaves every 15min and auto-restores the last save on
# server start, so a `kill -9`'d server or a reboot comes back on its own
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# fzf-based fuzzy switcher across sessions/windows/panes (prefix+F) — the
# built-in prefix+s tree gets unwieldy once you have 8+ similarly named
# sessions; this filters by fuzzy match instead of scanning a list
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
# Default filter is "word" (every token, incl. other panes in the window) —
# reorder so file paths come up first (ctrl-f still cycles: line/word/url),
# and scope grabbing to this pane's scrollback, not every pane in the window
set -g @extrakto_filter_order "path line word url"
set -g @extrakto_grab_area "full"

# --- Plugin manager (TPM) — keep last ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
