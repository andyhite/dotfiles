# Overrides only — btop fills in every other key from its own defaults, the
# same convention as config/atuin/config.toml and config/lazygit/config.yml.
#
# save_config_on_exit is the one setting that isn't taste: btop's default is
# `true`, and it rewrites its ENTIRE config file (every key, not just this
# one) back to disk on every quit — confirmed by launching it against this
# exact file and diffing before/after. Left at the default, the first `btop`
# and `q` after `install.sh` runs would silently balloon this file into a
# ~280-line dump of every built-in option and turn it into a live, constantly
# -diffing file the moment two machines quit btop with different terminal
# sizes or GPU detection results. Setting it to `false` here keeps this file
# exactly what's tracked, forever.
color_theme = "one-dark"
save_config_on_exit = false
