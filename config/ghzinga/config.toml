# ghzinga — GitHub issue/PR viewer TUI (github.com/osolmaz/ghzinga)
#
# Read by the `gzg` binary, NOT by the herdr plugin. The plugin
# (config/herdr/plugins/config/dutifuldev.ghzinga) is declarative wiring only and
# reads nothing; every dial lives here. Path resolution order inside gzg:
#   $GZG_CONFIG_PATH → $XDG_CONFIG_HOME/ghzinga/config.toml → ~/.config/ghzinga/config.toml
#
# Every key below also has a CLI flag (--theme, --symbols, …) that wins for one
# launch. A missing file is fine and means "all defaults" — this file exists to
# pin the theme and to write the dials down somewhere reviewable.
#
# WARNING: ghzinga's in-app settings overlay (saved from the TUI) rewrites this
# file through a serializer that emits only the six [ui] keys. These comments do
# not survive that. Re-apply them from git if you ever save settings in-app.

[ui]
## Matches every other TUI in this repo — herdr, ghostty, atuin, nvim are all
## one-dark. ghzinga's own default is "default", which is Tokyo Night, not a
## neutral palette, so leaving it unset would be the odd one out.
theme = "one-dark"

## Default. Nerd Font glyphs for PR/issue/check state; "ascii" (alias "plain")
## is the fallback for a terminal without one. Ghostty here has the font.
symbols = "emoji"

## Default. "compact" (alias "dense") drops the blank lines between sections —
## worth switching if the viewer pane ends up narrow.
spacing = "comfortable"

## Default. Caps body text at `fixed_width` columns for readability rather than
## letting it span the pane; "full" (alias "fluid") uses the whole width.
width_mode = "fixed"

## Default. Only consulted when width_mode = "fixed". Clamped to 72–180
## SILENTLY — an out-of-range value is corrected with no diagnostic, unlike the
## enum keys above, which warn and fall back.
fixed_width = 118

## Default. Scrollbar appears while scrolling, then fades. "always" / "hidden".
scrollbar = "on-scroll"

# ── Dials that are NOT in this file ──────────────────────────────────────────
#
# Environment only, no config-file equivalent:
#   GZG_API_DEPTH=partial|full   partial (default) keeps GitHub API quota low;
#                                full follows all pagination. ghzinga prints a
#                                hint naming this var when it truncates data.
#   GZG_SESSION                  default session name when --session is absent.
#   GHZINGA_BIN                  explicit binary path; unnecessary for a normal
#                                cargo install.
#
# Auth: GH_TOKEN → GITHUB_TOKEN → `gh auth token`. `gh` is authenticated here,
# so nothing to set. Public repos also work with no credentials at all via an
# unauthenticated REST fallback; a token is only required for private repos.
#
# Refresh cadence is --refresh-seconds (default 300) and has no config key.
