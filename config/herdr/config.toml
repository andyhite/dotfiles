# Top-level keys must precede the first table header.
onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "one-dark"
auto_switch = false

## Herdr's own accent, pinned to Ghostty's palette 4 (config/ghostty/config ->
## One Dark Two, `palette = 4=#71b9f4`) so herdr's chrome and everything running
## inside a pane agree on what "blue" is. herdr's own one-dark accent is #61afef.
##
## There is also a `[ui] accent` key documented in `herdr --default-config`. It's
## the same knob: when both are set theme.custom wins and ui.accent paints
## nothing, so only one belongs in this file.
[theme.custom]
accent = "#71b9f4"

## The five below are contrast repairs, not taste. herdr's one-dark assumes its
## own base (#282c34) is the background, but the sidebar, pane borders and
## status rows all render on bg=default — which is Ghostty's background,
## #21252b. Everything herdr dims lands ~10% darker than the theme intended.
##
## Ratios are WCAG contrast against #21252b. 3:1 is the floor for borders and
## icons, 4.5:1 for text. Foregrounds are raised along one-dark's own grey axis
## (hue 219, sat 9.8%) so the palette stays one-dark, and the four dim tiers
## stay ordered and distinct: 4.03 < 4.72 < 5.58 (subtext0) < 7.22 (text).
##
##   overlay0     2.55 -> 4.03  sidebar headers, UNFOCUSED PANE BORDERS, hint
##                              text, overlay scrollbar track, `unknown` state
##                              icon, branch on unselected rows. This is the one
##                              that was actually unreadable.
##   overlay1     3.56 -> 4.72  scrollbar thumb, inactive settings-tab labels,
##                              the tab bar's `+`
##
## The other three are surfaces. Stock one-dark makes panel_bg and surface_dim
## the SAME colour (#282c34) and puts surface0 one step off it, so on a #21252b
## canvas all three read as "nothing": the tab bar, every overlay, the selected
## sidebar row and the sidebar divider were all within 1.10 of the background.
## Lifting them is zero-sum — every point of separation costs the text on top —
## so these are the smallest values that stop them disappearing.
##
##   panel_bg     1.10 -> 1.25  tab bar, overlay/modal/toast surface, mode bar.
##                              Also serves as the FG on accent chips, which
##                              stays at 5.83 here.
##   surface_dim  1.10 -> 1.27  sidebar<->content divider and the SELECTED
##                              SIDEBAR ROW band
##   surface0     1.07 -> 1.22  (measured against panel_bg) inactive tab chips,
##                              input fields, selected rows inside overlays
##
## Worst case across all of it: the branch name on a selected row goes
## 4.75 -> 4.12, overlay hint text 2.32 -> 3.22. Nothing lands below 3.
##
## Deliberately NOT set: `text` and `subtext0` already clear 5.5:1, and `red`,
## `green`, `yellow`, `teal`, `blue`, `mauve` are the agent-state and git colors
## — all above 4:1 and worth keeping recognisable. `peach` and `surface1` are
## accepted by the parser but paint nothing in any herdr surface, so they are
## not worth carrying here.
overlay0    = "#7a8393"
overlay1    = "#878f9c"
panel_bg    = "#31353c"
surface_dim = "#32363e"
surface0    = "#3d424b"

[ui]
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
mouse_scroll_lines = 1
agent_panel_sort = "spaces"

## herdr-agent-inbox's sidebar-grow / sidebar-shrink actions (prefix+alt+l and
## prefix+alt+h below) rewrite these three numbers in place and reload. They
## bail out with an error if ANY of the three is missing, which is why all
## three are spelled out here even though every value is herdr's own default.
##
## The actions pin all three to the target width to force it past herdr's
## clamp-on-reload, then relax min/max back to 20/60 so the mouse can still
## drag the divider. So expect these numbers to drift in git as you resize —
## that's the feature working, not a stray edit.
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36

# ── Sidebar rows ─────────────────────────────────────────────────────────────

# herdr's packed sidebar only renders tokens you name here. One plugin reports
# custom ones and is silently invisible without this block:
#   herdr-agent-inbox  $title (derived session name), $flag (⚑ settled /
#                      ● unread), $age (session runtime), $since (time in
#                      current state), and workspace-level $agents / $busy
#
# Builtins stay bare (state_icon, workspace, tab, agent, branch, git_status);
# custom tokens keep the $. A styled token becomes a table.

[ui.sidebar.agents]
## Line 1 is the answer to "what is this?" — the AI-derived session title,
## dimmed so it reads as metadata rather than the name.
## Line 2 is the answer to "should I care right now?" — the unread/settled flag
## first, then which agent and where, then how long it's been going.
##
## `tab` is deliberately absent from line 2: agent-inbox renames the tab to
## this same $title, so showing both would print the name twice per row.
rows = [
  ["state_icon", "$title"],
  [{ token = "$flag", fg = "#e5c07b", bold = true }, "agent", "workspace", { token = "$age", dim = true }],
]

[ui.sidebar.spaces]
## $agents is the per-state count, $busy the longest current working stint —
## together they answer "is this workspace waiting on me" without expanding it.
## Second row is the git context that makes a worktree identifiable at all.
rows = [
  ["state_icon", "workspace", "$agents", { token = "$busy", dim = true }],
  ["branch", "git_status"],
]

# ── Experimental ─────────────────────────────────────────────────────────────

[experimental]
## Renders images (agent-attached screenshots, etc.) inline in the pane via the
## Kitty graphics protocol instead of herdr's fallback. Ghostty implements the
## Kitty graphics protocol natively, so the "Kitty graphics-compatible outer
## terminal" requirement (`herdr --default-config`) is already met here.
kitty_graphics = true

# ── Keybindings ──────────────────────────────────────────────────────────────

# These mirror this repo's nvim setup (config/nvim + NvChad defaults) with
# herdr's prefix standing in for nvim's <C-…> and <leader>, so one set of
# muscle memory drives both. nvim side, for reference:
#
#   <C-h/j/k/l>     switch window          -> focus_pane_*      prefix+h/j/k/l
#   <C-w>s / <C-w>v :split / :vsplit       -> split_*           prefix+s / prefix+v
#   <C-w>H/J/K/L    move window            -> swap_pane_*       prefix+shift+h/j/k/l
#   <C-w>q          close window           -> close_pane        prefix+q
#   <C-n>           NvimTreeToggle         -> toggle_sidebar    prefix+n
#   <tab>/<S-tab>   buffer next/prev       -> next/previous_tab prefix+tab/shift+tab
#
# Overrides only, so herdr's other defaults keep flowing through. The prefix is
# untouched (ctrl+b), and focus_pane_* already matches nvim by default so it's
# deliberately absent below.
#
# Non-navigate bindings MUST include `prefix+`; herdr rejects a bare key as an
# "unsafe direct keybinding" because it would intercept typing. The navigate_*
# family is the inverse — it must NOT include the prefix.
[keys]
## :split — a horizontal divider, new pane below. Replaces prefix+minus, whose
## `-` glyph is where the direction semantics came from: minus is the divider,
## not the axis, so this is vim's :split and not tmux's -h.
split_horizontal = "prefix+s"
## :vsplit — already prefix+v by default; restated only because leaving it out
## next to the line above reads like an oversight.
split_vertical = "prefix+v"

## Displaced by :split above. `,` is the neovim convention for config UI.
settings = "prefix+,"

## <C-w>H/J/K/L — move the pane itself, shift-mirroring the h/j/k/l that move
## focus. Unbound by default, so nothing is lost here.
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

## <C-w>q closes the window in vim, and q is the strongest "close this" key
## there is. That displaces detach onto prefix+d, which is where tmux has always
## put it, and leaves prefix+shift+d as close_workspace.
close_pane = "prefix+q"
detach = "prefix+d"

## <C-n> in nvim. Not <leader>e — that's NvimTreeFocus, and herdr has no
## focus_sidebar action, so the sidebar can be shown and hidden but cursor focus
## can't be moved into it. What the sidebar *lists* is reachable though: see the
## workspace and agent bindings below. Takes prefix+n from next_tab, which moves
## to nvim's own buffer-cycling keys. edit_scrollback keeps its default prefix+e.
toggle_sidebar = "prefix+n"

## <tab> / <S-tab> used to cycle buffers along nvim's tabufline, mirrored here
## as next_tab/previous_tab — but cmd+shift+[/] is a stronger match: it's the
## same chord browsers (and Ghostty's own native tabs) use for tab switching,
## so cycling herdr tabs needs no prefix at all. That only reaches herdr
## because config/ghostty/config unbinds its own default super+shift+[ /
## super+shift+] (native tab switching) — see the comment there; without it
## Ghostty eats the chord before herdr ever sees it. Freeing prefix+tab
## restores herdr's default cycle_pane_next/previous binding, which goes
## unused here anyway since directional focus_pane_* covers the same ground.
next_tab = "cmd+shift+]"
previous_tab = "cmd+shift+["

## The sidebar's two lists, by keyboard. Workspaces already had prefix+w
## (the "workspaces / tabs" picker) and prefix+g (the session navigator, whose
## bare up/down are the navigate_workspace_* pair) — these add direct jumps.
## Every action below is unbound by default, so nothing is displaced.
##
## Workspaces go on bare cmd+[/] — same chord as a browser's back/forward
## navigation, so cycling herdr workspaces doesn't need the prefix either.
## That only reaches herdr because config/ghostty/config unbinds its own
## default super+[ / super+] (goto_split:previous/next) — see the comment
## there; without it Ghostty eats the chord before herdr ever sees it.
##
## Agent navigation (next_agent/previous_agent) is deliberately left unbound:
## unused, and this keeps the bracket convention above reserved for tabs and
## workspaces instead of tripling it up onto agents too.
next_workspace = "cmd+]"
previous_workspace = "cmd+["

## Indexed actions: these take a 1..9 range rather than a single key, the same
## shape as the built-in switch_tab = "prefix+1..9". Modifiers keep the three
## index families apart — plain digits are tabs, shift is workspaces, alt is
## agents.
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

## Inside the navigator (prefix+g). These are the one family that must NOT carry
## the prefix — they're keys within the mode, not global bindings.
##
## herdr splits the mode across two axes: navigate_pane_* owns h/j/k/l, so j/k
## walks panes and the agents listed in them, while the spaces list is a
## separate axis that defaults to the bare arrow keys. That's why j/k appears to
## work in the agents list and do nothing in the spaces list — they're different
## actions, and j/k can't drive both.
##
## ctrl+j / ctrl+k for the outer axis, because that's already what <C-j>/<C-k>
## mean in nvim: move between containers, not within one. Plain j/k stays
## within a list. This replaces the arrow-key default rather than adding to it —
## one key per action — so up/down no longer move between spaces.
navigate_workspace_up = "ctrl+k"
navigate_workspace_down = "ctrl+j"

# ── Plugin keybindings ───────────────────────────────────────────────────────

# [keys] above only understands herdr's OWN action names. There is no field
# there for a plugin action — the only way to bind one is a [[keys.command]]
# block shelling out to the herdr CLI, which is what all of these are.
#
# `type` is "shell" throughout: these are short control commands that return
# immediately. "pane" would flash a temporary pane and "popup" a modal terminal,
# both of which are wrong for a command whose entire output is a state change.
#
# Several of these plugins' READMEs still document `type = "plugin_action"` with
# a combined "<plugin>.<action>" string. That form is dead on 0.8 — `herdr
# --default-config` documents only shell/pane/popup.
#
# These must stay at the END of the file: once TOML sees [[keys.command]], the
# [keys] table above is closed and no further bare keys can be added to it.
#
# The layout, roughly: plain prefix+<letter> opens or marks something, and
# prefix+alt+<letter> is the plugin layer, reusing the letter of whatever local
# action it parallels.

## vim-herdr-navigation — the one family bound WITHOUT the prefix, because the
## point is that ctrl+h/j/k/l behaves identically whether the focused pane holds
## nvim or a shell. The plugin checks the pane's foreground process: nvim gets
## the raw chord (and config/nvim/lua/herdr-nav.lua hands focus back to herdr
## only once nvim is already at the edge of its own splits), anything else moves
## herdr's pane focus directly.
##
## The cost, in non-nvim panes: zsh loses ctrl+l (clear-screen), ctrl+k
## (kill-line) and ctrl+j (the accept-line alias for Enter — plain Enter is
## unaffected, it sends CR where ctrl+j sends LF). prefix+h/j/k/l still moves
## panes unconditionally, so nothing is unreachable.
##
## Backspace is NOT affected, despite ctrl+h being the classic worry: Ghostty
## sends DEL (0x7f) for Backspace and 0x08 for ctrl+h, and nothing in
## config/ghostty/config remaps that.
##
## No conflict with navigate_workspace_* above either — those bind only inside
## the prefix+g navigator, where pane focus isn't in play.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "herdr plugin action invoke left --plugin vim-herdr-navigation"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "herdr plugin action invoke down --plugin vim-herdr-navigation"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "herdr plugin action invoke up --plugin vim-herdr-navigation"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "herdr plugin action invoke right --plugin vim-herdr-navigation"

## herdr-agent-inbox — the inbox itself, as a split beside the current pane
## rather than the overlay its manifest declares. `--placement` overrides the
## manifest, and a split is the right shape here: the inbox is a picker you act
## from, so you want it next to the agent you're triaging, not covering it.
## With no --target-pane it splits whichever pane is focused, which from a
## keybinding is always the one you're looking at.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = "herdr plugin pane open --plugin herdr-agent-inbox --entrypoint inbox --placement split --direction right"

## m / shift+m are the two halves of one idea: mark this agent handled, or mark
## it as still wanting me. Settling drops it to the bottom of the inbox; unread
## flags it up to attention rank. Both are undone automatically the moment the
## agent starts working or blocks again.
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "herdr plugin action invoke settle --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = "herdr plugin action invoke unread --plugin herdr-agent-inbox"

## Same idea, whole workspace: settles every agent here that's done, idle or
## unknown. The end-of-session sweep.
[[keys.command]]
key = "prefix+alt+m"
type = "shell"
command = "herdr plugin action invoke settle-workspace --plugin herdr-agent-inbox"

## Throw away this agent's cached session title and derive a new one — for when
## the opening prompt turned out not to describe where the session went. Plain
## prefix+t is free; prefix+shift+t is herdr's own rename_tab, which is the
## manual counterpart (and permanently releases the tab from auto-naming).
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr plugin action invoke retitle --plugin herdr-agent-inbox"

## h/l = narrower/wider, the vim axis. These rewrite sidebar_width and the two
## bounds in this file and reload — see the [ui] comment above.
[[keys.command]]
key = "prefix+alt+h"
type = "shell"
command = "herdr plugin action invoke sidebar-shrink --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+alt+l"
type = "shell"
command = "herdr plugin action invoke sidebar-grow --plugin herdr-agent-inbox"

## The daemon is started by herdr's startup hook and re-checked on every
## pane.agent_detected, so it normally self-heals. This is for when it doesn't.
[[keys.command]]
key = "prefix+alt+d"
type = "shell"
command = "herdr plugin action invoke restart-daemon --plugin herdr-agent-inbox"

## command-palette — fzf over EVERY action of EVERY installed plugin, built at
## run time from `herdr plugin action list`, so it needs no maintenance as
## plugins come and go. This is what makes the "deliberately unbound" list
## below a decision rather than a loss.
##
## prefix+p is free here: herdr's default previous_tab lives there, and this
## config moved that to prefix+shift+tab.
##
## The one binding in this file that isn't `type = "shell"`, and it runs a
## script from this repo rather than the herdr CLI. Both of those follow from
## fzf needing a TTY: a herdr action runs server-side without one, so the
## jt.command-palette plugin this replaces had to bounce its action through an
## `overlay` plugin pane to get a terminal, and an overlay covers the whole
## canvas. `type = "popup"` is a session-modal terminal that leaves the tab
## layout alone, and a keybinding can point straight at the script.
## config/herdr/palette/palette.sh has the rest of that story, including what
## the plugin was doing about cwd and why a popup doesn't need it.
##
## Sized in cells rather than percent because the content is a fixed size, not
## a fraction of whatever display it opens on. The widest row is a 37-column
## title, two spaces and a 30-column plugin id, plus fzf's pointer and the
## popup border — 73, with the rest as slack. A percentage would be narrower
## than that on the Linux VM and pointlessly wide on this display.
##
## Height is the same argument turned around. At 70% this covered most of the
## screen to show two dozen rows, so the popup read as a pane you had to
## dismiss rather than something transient. 20 cells is roughly a screenful of
## palette on any display and still shows most of the list at once; the rest
## scrolls (palette.sh rebinds ^d/^u for that). Deliberately NOT sized to the
## action count: the list grows and shrinks with the installed plugins, and a
## palette that changes shape when you add a plugin is worse than one that
## scrolls.
##
## The frame says "popup" and there is no way to change that as of herdr 0.8.0,
## so don't spend the afternoon again: `keys.command` has no `title` key (`herdr
## config check` answers `unknown config key keys.command.N.title; ignoring
## key`), the plugin-pane API that does carry a title can't be reached from the
## CLI (`--placement` offers overlay/split/tab/zoomed, not popup), and the label
## is a hardcoded string in herdr's TUI, not the child's terminal title — a
## palette.sh that set OSC 2 changed nothing. `type = "pane"` would be titled,
## because panes track terminal_title, but a pane resizes the layout, which is
## the whole reason this is a popup.
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "$HOME/.config/herdr/palette/palette.sh"
width = 80
height = 20

# Deliberately unbound — all reachable through prefix+p:
#   worktree-setup     no actions at all; it is purely a worktree.created hook.

# ── Local layout commands ────────────────────────────────────────────────────

## fold-columns — turn a row of N side-by-side panes into N/2 columns of two
## stacked panes, pairing left to right. Past three or four agents abreast every
## pane is too narrow to read while the space under each one goes unused, and
## this trades one back for the other. An odd pane out keeps its own full-height
## column.
##
## prefix+f is free: herdr binds nothing to f by default, and neither does the
## [keys] table above.
##
## A script in this repo rather than an inline `command` string, for the same
## reason the palette is one: herdr has no restack or layout command at all, so
## the fold is a sequence of pane moves around a herdr quirk — a same-tab
## `pane move --split down` is a silent no-op — and that takes a paragraph to
## explain. config/herdr/layout/fold-columns.sh carries the paragraph; a TOML
## string can't. `type = "shell"` because the entire output is a state change,
## same as the plugin blocks above. Those come first only because TOML requires
## every [[keys.command]] to follow the [keys] table, not because this one is a
## plugin action.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "$HOME/.config/herdr/layout/fold-columns.sh"
