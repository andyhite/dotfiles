# herdr-agent-inbox — one daemon doing two jobs.
#
# It derives a session title per agent pane and reports it as pane metadata,
# and it ranks every agent by how much it wants you: blocked (0), done or
# manually flagged (1), working (2), idle (3), unknown (4), settled (5). The
# inbox overlay (prefix+i) sorts on that rank; the tab labels below reuse the
# same title. So naming isn't a separate feature bolted on, it's the same
# derived title surfaced in a second place.
#
# This plugin replaced tab-smart-rename, which did tab naming alone and did it
# worse: it re-evaluated a tab on a 10-minute timer with no way to damp it, and
# had renamed one tab 28 times in 12 hours before it was removed. Here the title
# is derived once from the opening prompt and cached by content hash.
#
# Hot-reloaded by mtime on the next refresh, so edits land within ~0.4s of the
# next herdr event, or 30s at worst. No restart needed.

[title]
## Use the title the agent gives its own session when it publishes one — claude
## records a session name, and codex exposes a thread title via its sqlite
## store. Falls through to the prompt-derived title below when there isn't one.
## Native titles are free and already what you'd see in that agent's own UI.
prefer_agent_title = true

## Which prompt seeds the title when there's no native one.
##   "first" — the opening request, the way a chat UI names a thread
##   "last"  — the most recent request, re-derived after every completed turn
## "first" is the whole reason this is stabler than the old plugin: a session's
## name stops moving once it has one. "last" reintroduces exactly the churn we
## just got rid of.
source = "first"

## Pipe the prompt through a command instead of showing it truncated. The
## command gets an envelope on stdin (Agent / Workdir / Request) and must print
## the title as its first stdout line.
##
## On, because the raw first prompt makes a poor label — it's whatever you
## happened to type, cut at 56 characters. Haiku is the right tool: this runs
## once per session, cached by prompt hash, so it's a handful of tokens for a
## name you then read all day. `claude` is already installed and authenticated.
##
## Set false to get deterministic, zero-cost, offline names instead. Nothing
## else has to change — the truncated-prompt path is always the fallback.
summarize = true
summarize_cmd = "claude -p --model claude-haiku-4-5-20251001 'Write a 4-8 word title for this coding-agent session request. Output ONLY the title, nothing else.'"

## Per-call timeout, clamped to 5..600. Default 60. Calls run one at a time, so
## this also bounds how long a queue of new sessions takes to name itself.
summarize_timeout_secs = 60

[tab]
## THE switch this plugin was installed for. Off by default upstream; on here.
## Renames each tab to the session title of whichever agent in it is loudest —
## blocked beats done beats working beats idle, newest state change breaks ties.
rename_from_agent_title = true

## Label budget before truncation, ellipsis included (accepted range 4..200).
## Upstream default is 24, which cuts a 4-8 word Haiku title mid-phrase more
## often than not. 28 fits most of them; much beyond that and the tab bar stops
## showing enough tabs to be worth having.
max_chars = 28
ellipsis = "…"

## A tab is only managed while its label is herdr's default (the bare tab
## number) or the exact label this plugin last set. Rename a tab by hand and the
## plugin lets go of it permanently — set the label back to its number to hand
## it back. Leave true; false means your manual names get overwritten.
respect_manual = true

# ── Not configurable, so you don't go looking ────────────────────────────────
# The 0.4s event debounce, the 30s fallback tick, the 56-char internal session
# title cap, the three-day retention for vanished terminals, and the +/-2 step
# on the sidebar resize actions are all source constants.
#
# State lives in ~/.config/herdr/agent-inbox-state/ (mode 0700): derived titles,
# project paths, the last label this plugin set per tab, daemon.log, and a 0600
# control socket. Untracked — it's generated state, same call as herdr's own
# plugins.json.
