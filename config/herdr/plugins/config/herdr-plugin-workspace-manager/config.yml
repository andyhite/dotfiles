# yaml-language-server: $schema=https://raw.githubusercontent.com/razajamil/herdr-plugin-workspace-manager/main/schema.json
#
# workspace-manager — every new worktree opens already arranged.
#
# Under the foreman loop a worktree is created per GitHub issue, and each one
# starts as a bare single pane that has to be rebuilt by hand: agent here,
# editor there, a shell for tests. This declares that shape once.
#
# Only fresh (1-tab/1-pane) worktree workspaces are touched. The repo's main
# checkout is never rearranged, and refocusing an existing worktree is a no-op.
#
# NOTE: reviewr's auto_open was turned OFF when this was added — it also hooked
# worktree.created and opened its own split, so the two were arranging the same
# new workspace. The diff pane is a tab here instead, which keeps one owner of
# the layout. prefix+alt+r still toggles reviewr by hand anywhere.

layouts:
  # The everyday shape: agent to work in, editor beside it, tests and diff a
  # tab away. Deliberately only two panes in the first tab — a third column on
  # a laptop screen leaves nothing readable.
  - id: issue
    tabs:
      - title: agent
        panes:
          - title: omp
            # `agent:` is not the same as typing the command: herdr starts it
            # via `herdr agent start` and the layout blocks until herdr has
            # actually detected it and marked it ready for input. That also
            # means it shows up as a real agent in the inbox and sidebar
            # rather than an unrecognised process.
            agent: omp
          - title: editor
            command: nvim
            split: vertical
            size: "45%"
      - title: shell
        panes:
          - title: shell
      - title: review
        panes:
          # Not `agent:` — lazygit is an ordinary TUI. Commands run in the
          # interactive login shell, so mise/direnv/PATH from zshrc apply.
          - title: lazygit
            command: lazygit

  # For a one-line fix that doesn't need an editor or a review tab.
  - id: issue-quick
    tabs:
      - title: agent
        panes:
          - title: omp
            agent: omp

workspaces:
  - repo: ~/Code/andyhite/plotroom
    defaultLayout: issue
    # First match wins, so order matters. Branch globs run over the WHOLE
    # branch name and `*` spans `/`.
    layoutMatching:
      - title: Small fixes and chores
        worktreePattern: "{fix,chore,docs}/*"
        layout: issue-quick

  - repo: ~/Code/andyhite/dotfiles
    # No editor/lazygit split needed for config edits — the agent pane is the
    # whole job here.
    defaultLayout: issue-quick

# Add a repo by appending to `workspaces` — `repo` accepts a path (with ~) or a
# bare repo name, and matches any linked worktree of it. Without an entry a
# worktree just opens the way herdr makes it, which is the safe default.
#
# Cleanup after merges is a separate CLI, not an event:
#   herdr plugin action invoke remove-gone --plugin herdr-plugin-workspace-manager
# That previews worktrees whose upstream branch was deleted. It skips the main
# checkout, the workspace you run it from, and anything with uncommitted changes.
