# reviewr — diff review TUI in a split pane.
#
# Reads the git worktree, shows uncommitted / branch / last-turn diffs, and lets
# you attach line comments and then either paste them into an agent pane or copy
# them to the clipboard. It is NOT an AI reviewer: no provider, no model, no key,
# no network except the optional PR tab, which shells out to `gh`.
#
# Validation is all-or-nothing. An unknown key, a wrong type, or one bad enum
# value invalidates this ENTIRE file and the plugin falls back to defaults — it
# does not skip the offending line. Check with:
#   herdr plugin action invoke open --plugin persiyanov.reviewr

## Matches herdr, ghostty, nvim, atuin and ghzinga. reviewr's own default is
## catppuccin. This sets both the UI palette and the syntax highlighting.
theme = "one-dark"

## Ordered candidates for the `branch` scope's merge-base. Each is probed as
## origin/<name> first, then as a local branch; the first that resolves wins,
## and a leading origin/ or refs/heads/ is stripped for you. Default is
## ["main", "master"]; "develop" is appended for the repos that still use it,
## and it sits last so it can never win over a real main.
base_branches = ["main", "master", "develop"]

## Which diff the pane opens on: "uncommitted" (working tree vs HEAD, including
## staged and untracked), "branch" (merge-base vs HEAD plus working tree), or
## "last-turn" (what the agent changed since its current turn started).
##
## "last-turn" is the one that pairs with an agent pane, and it's the reason to
## override the "uncommitted" default: opening reviewr next to a working agent
## is nearly always a question about what THAT TURN did, not about everything
## uncommitted in the tree. u / b / t switch scope at runtime, and a scope
## picked by hand outlives this setting for the rest of the session.
##
## Caveat worth knowing: last-turn samples at the --poll interval (2s), so a
## turn shorter than that can be missed entirely.
default_scope = "last-turn"

## Where the file/hunk navigator sits inside the pane. reviewr opens as a
## vertical split, so the pane is already tall and narrow — a right-hand
## navigator would leave almost nothing for the diff. Along the bottom keeps
## full width for code. `p` rotates it at runtime.
navigator_position = "bottom"

## How the toggle action opens the pane. "split" + "right" is the default and
## the right shape here: overlay and zoomed cover the agent you're reviewing,
## and a tab loses the side-by-side entirely. Split also deliberately does not
## steal focus, unlike the other three.
toggle_placement = "split"
toggle_direction = "right"

## OFF, and this is the one setting here that isn't the upstream default.
##
## reviewr auto-opens on worktree.created. So does workspace-manager, which now
## owns the layout of every new worktree — two plugins arranging the same fresh
## workspace race each other and you get a pane you didn't ask for on top of
## the one you declared. workspace-manager's `issue` layout carries a review
## tab instead, so nothing is lost.
##
## The explicit `open`/`toggle` actions ignore this setting, so prefix+alt+r
## still works anywhere, in or out of a worktree.
auto_open = false

# ── Not set, and why ─────────────────────────────────────────────────────────
#
# github_host / gitlab_host / azure_devops_host add ONE self-hosted forge
# hostname each (bare DNS name, no scheme, and not one of the built-ins). Only
# github.com is in play here, which is a built-in, so all three stay unset.
# The PR tab also needs the matching CLI authenticated: `gh` is installed and
# handles GitHub; `glab` and `az` are not installed, so the PR tab is simply
# unavailable for GitLab/Azure remotes. Changes and All-files still work there.
#
# [keybindings] replaces the key array for any of 33 in-pane actions. The
# defaults are already vim-shaped — j/k move, ]/[ walk hunks, v selects, c
# comments, /  searches, q quits, s sends to the agent, y copies — so there's
# nothing to fix. Each binding is a single character with an optional ctrl+ or
# alt+; a duplicate key anywhere invalidates the whole file. `?` lists them.
