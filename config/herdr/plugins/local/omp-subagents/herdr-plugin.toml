id = "omp.subagents"
name = "OMP Subagent Panes"
version = "0.2.0"
# 0.8.0 is the earliest herdr release this was developed and tested against
# (`herdr plugin pane open --plugin ... --entrypoint ...`, see pane.sh usage in
# the extension). No older-version fallback was verified, so the floor is
# exact rather than padded down.
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Read-only live transcript pane, auto-opened per omp subagent by the herdr-subagent-panes omp extension."

# Installs src/viewer.ts's native-renderer dependencies, pinned to the
# installed `omp` binary's own version — see scripts/install.sh. Verified
# empirically that `herdr plugin link` does NOT run [[build]] for a linked
# local plugin: a fresh `herdr plugin link` against a directory with no
# `node_modules` reported `plugin_linked` and echoed this manifest's
# `[[build]]` entry back in its JSON response, but left `node_modules`
# absent — the manifest is read, the step just never runs. `install.sh`'s
# local-plugin loop (this repo's root `install.sh`) is what actually invokes
# this step, right after linking, to compensate.
[[build]]
command = ["bash", "scripts/install.sh"]

# The only surface this plugin exposes. It has no actions, no keybindings, and
# registers no events of its own — everything that decides *when* a pane opens
# lives in the omp extension (omp/agent/extensions/herdr-subagent-panes.ts),
# which calls `herdr plugin pane open --plugin omp.subagents --entrypoint viewer`
# itself on the task:subagent:lifecycle "started" event. This manifest only
# has to describe the pane shape; placement/direction here are just the
# default the extension's own --placement/--direction flags override.
[[panes]]
id = "viewer"
title = "Subagent"
placement = "split"
command = ["bun", "run", "src/viewer.ts"]
