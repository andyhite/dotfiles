"$schema" = 'https://starship.rs/config-schema.json'

# Configures the format of the prompt.
format = """
[](color_red0)\
$os\
$username\
$hostname\
[](bg:color_orange fg:color_red0)\
$directory\
[](fg:color_orange bg:color_yellow)\
$git_branch\
$git_status\
[](fg:color_yellow bg:color_green)\
$c\
$dotnet\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$elixir\
$elm\
$gradle\
$julia\
$nim\
$scala\
[](fg:color_green bg:color_cyan)\
$docker_context\
[ ](color_cyan)\
$fill\
([ ](mono4)\
$time\
$battery\
[](mono4))\
$line_break$character"""

# Sets the palette to "github_dark_default".
palette = 'github_dark_default'

# Default (500ms) is too tight whenever Spotlight's mdworker_shared is
# reindexing — not just right after a reboot, any bulk reindex (e.g. after
# installing/downloading a lot of files) spikes load enough that git_branch/
# git_status's `git` calls miss it and starship prints a WARN.
command_timeout = 2000

# Sets the colors of the "github_dark_default" palette. Hex values come from
# Ghostty's own bundled "GitHub Dark Default" theme resource (the 16-color
# ANSI palette actually rendered on this terminal). Segment backgrounds use
# the neutral ANSI 1-6 colors, not the bright ANSI 9-14 ones: this theme's
# bright row is tuned for a handful of emphasized glyphs against a dark
# background, not for painting whole powerline blocks — using it for every
# segment made the bar read as neon. The bright variants stay in reserve for
# the few small accents (battery-critical, error/replace-mode icons) that
# should still pop.
[palettes.github_dark_default]
mono0 = '#ffffff' # terminal white — bright fg (ANSI 15).
mono1 = '#e6edf3' # syntax_fg.
mono2 = '#b1bac4' # ANSI white — muted fg.
mono3 = '#6e7681' # ANSI bright black — comment grey.
mono4 = '#161b22' # raised-panel bg, not page bg.
color_red0 = '#ff7b72' # neutral red — segment backgrounds.
color_red1 = '#ffa198' # bright red — reserved for battery-critical fg.
color_green = '#3fb950' # neutral green — segment backgrounds.
color_yellow = '#d29922' # neutral yellow — segment backgrounds.
color_blue = '#58a6ff' # normal blue — same accent used everywhere else.
color_purple = '#bc8cff' # neutral purple — segment/icon backgrounds.
color_cyan = '#39c5cf' # neutral cyan — segment backgrounds.
color_orange = '#d29922' # neutral orange — segment backgrounds (theme has no distinct orange; reuses warning yellow).
syntax_fg = '#e6edf3'
syntax_bg = '#0d1117'
color_bg2 = '#21262d' # one step past mono4 on the same surface ladder.
syntax_gutter = '#6e7681'
syntax_accent = '#58a6ff' # same accent blue used everywhere else.

# Module that displays the current OS.
[os]
disabled = false # Disabled by default
style = "bg:color_red0 fg:syntax_bg"
format = '[ $symbol ]($style)'

# Sets custom symbols for each OS.
[os.symbols]
Alpine = ""
Amazon = ""
Android = "󰀲"
Arch = ""
CentOS = ""
Debian = "󰣚"
EndeavourOS = ""
Fedora = "󰣛"
FreeBSD = "󰣠"
Gentoo = "󰣨"
Illumos = ""
Linux = "󰌽"
Macos = "󰀵"
Manjaro = "󱘊"
Mint = "󰣭"
NixOS = "󱄅"
OpenBSD = ""
openSUSE = ""
Pop = ""
Raspbian = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Redox = "R"
Solus = ""
SUSE = ""
Ubuntu = "󰕈"
Unknown = ""
Windows = "󰍲"

# Module that displays the current username.
[username]
show_always = true
style_user = "bold bg:color_red0 fg:syntax_bg"
style_root = "bold italic bg:color_red0 fg:syntax_bg"
format = '[ $user ]($style)'

# Module that displays the hostname — only when connected over SSH.
[hostname]
ssh_only = true
style = "bold bg:color_red0 fg:syntax_bg"
format = '[@$hostname ]($style)'

# Module that displays the current directory.
[directory]
style = "italic fg:syntax_bg bg:color_orange"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Sets the custom symbols for directories.
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# Module that displays the current git branch.
[git_branch]
symbol = ""
style = "bg:color_yellow"
format = '[[ $symbol $branch ](fg:syntax_bg bg:color_yellow)]($style)'

# Module that displays the current git status.
[git_status]
style = "bg:color_green"
format = '[[($all_status$ahead_behind )](fg:syntax_bg bg:color_yellow)]($style)'

# Language specific modules
