  - amazon-bedrock
  - bedrock-mantle
  - abliteration
  - aiand
  - aimlapi
  - alibaba-coding-plan
  - alibaba-token-plan
  - baseten
  - cerebras
  - charm-hyper
  - cline-pass
  - cloudflare-ai-gateway
  - commandcode
