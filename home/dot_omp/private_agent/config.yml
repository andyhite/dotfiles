# Anchored so the `anthropic` preset below is this exact block, not a second copy that drifts.
# omp expands the alias into a literal copy whenever it rewrites this file, so a
# /modelpreset switch can't leave the preset pointing at the switched-to roles.
modelRoles: &anthropicRoles
  default: anthropic/claude-sonnet-5-5:medium
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:max
  task: anthropic/claude-sonnet-5-5:low
  smol: anthropic/claude-haiku-4-5:low
  commit: anthropic/claude-haiku-4-5:minimal
  tiny: anthropic/claude-haiku-4-5:minimal
  vision: anthropic/claude-sonnet-5-5:medium
  designer: anthropic/claude-opus-5-5:high
  advisor: anthropic/claude-sonnet-5-5:medium
# A preset switch clears every role it leaves out, so each preset names all of them,
# `designer` included. `openai` mirrors `anthropic` tier for tier on GPT-6, at the same
# thinking levels: astra for opus, 6.1-sol for sonnet, luna for haiku. Exceptions: luna
# has no `minimal`, so commit/tiny run `low`. GPT-6 has no terra; a 5.6-era id here
# still resolves but silently runs the previous generation. On a machine without
# openai-codex auth the switch is a no-op, not a half-applied setup.
modelPresets:
  anthropic:
    modelRoles: *anthropicRoles
    defaultThinkingLevel: high
  openai:
    modelRoles:
      default: openai-codex/gpt-6.1-sol:medium
      plan: openai-codex/gpt-6-astra:high
      slow: openai-codex/gpt-6-astra:max
      task: openai-codex/gpt-6.1-sol:low
      smol: openai-codex/gpt-6-luna:low
      commit: openai-codex/gpt-6-luna:low
      tiny: openai-codex/gpt-6-luna:low
      vision: openai-codex/gpt-6.1-sol:medium
      designer: openai-codex/gpt-6-astra:high
      advisor: openai-codex/gpt-6.1-sol:medium
    defaultThinkingLevel: high
modelProviderOrder:
  - anthropic
  - cursor
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
symbolPreset: nerd
theme:
  dark: dark-github
  light: light-one
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: custom
  separator: slash
  showHookStatus: true
  compactThinkingLevel: false
  transparent: true
  sessionAccent: true
  leftSegments:
    - pi
    - vim
    - hostname
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - status
    - model
    - mode
    - subagents
    - cost
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
