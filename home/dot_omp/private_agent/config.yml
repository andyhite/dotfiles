symbolPreset: nerd
theme:
  dark: dark-github
  light: light-one
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: custom
  separator: slash
  showHookStatus: true
  compactThinkingLevel: false
  transparent: true
  sessionAccent: true
  leftSegments:
    - pi
    - vim
    - hostname
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - status
    - model
    - mode
    - subagents
    - cost
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
terminal:
  showProgress: true
tui:
  textSizing: true
  codexResetFireworks: false
  tight: false
  scrollbackRebuild: true
  imeSafeCursor: false
  vimMode: true
  vimModeDisplay: text
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
  showTurnTime: true
task:
  showResolvedModelBadge: true
  eager: preferred
  isolation:
    commits: generic
    merge: patch
    enabled: true
personality: pragmatic
retry:
  # No model fallback: a silent mid-task hop to another provider changes behavior,
  # drops the prompt cache, and its last tier (cursor) is metered spend. A quota wall
  # is a deliberate `/modelpreset switch <name>` instead. Same-model retries still
  # ride out transient 429s/overloads. usageAwareFallback and the usageReserve* knobs
  # only steer toward fallback models, so with none they are dead config: left at
  # their defaults.
  modelFallback: false
  # Wait out an authoritative quota reset rather than failing past maxDelayMs, so
  # unattended runs resume on their own. Abortable, but it can hold subagents for hours.
  waitForUsageReset: true
advisor:
  enabled: false
interruptMode: wait
followUpMode: one-at-a-time
steeringMode: all
loop:
  mode: reset
doubleEscapeAction: none
error:
  notify: "on"
collab:
  displayName: andyhite
marketplace:
  autoUpdate: auto
startup:
  changelogMode: summary
  quiet: true
features:
  unexpectedStopDetection: smart
compaction:
  handoffSaveToDisk: true
  thresholdPercent: 40
  idleEnabled: true
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
  idleThresholdTokens: 200000
  idleTimeoutSeconds: 120
ttsr:
  contextMode: discard
  repeatMode: after-gap
memory:
  backend: "off"
autolearn:
  enabled: false
edit:
  mode: hashline
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
lsp:
  formatOnWrite: false
bash:
  autoBackground:
    enabled: true
  direnv: auto
bashInterceptor:
  enabled: true
astGrep:
  enabled: true
computer:
  enabled: true
debug:
  enabled: true
checkpoint:
  enabled: false
github:
  enabled: true
web_search:
  enabled: true
todo:
  eager: preferred
browser:
  relay: false
  cdpUrl: http://127.0.0.1:9222
plan:
  defaultOnStartup: false
  autosave: true
commands:
  enableClaudeUser: true
secrets:
  enabled: true
composer:
  shape: claude
  tokenRate: true
disabledExtensions:
  []
isolation:
  backend: auto
codexResets:
  autoRedeem: unset
defaultThinkingLevel: high
extendedContext: true
tools:
  xdevDocs: catalog
