  - deepinfra
  - deepseek
  - devin
  - firepass
  - fireworks
  - github-copilot
  - gitlab-duo
  - gitlab-duo-agent
  - gmi-cloud
  - google
  - groq
  - helmcode
  - kilo
  - litellm
  - meta
  - minimax
  - minimax-code
  - minimax-code-cn
  - mistral
  - moonshot
  - nanogpt
  - novita
