symbolPreset: nerd
theme:
  dark: dark-github
  light: light-one
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: custom
  separator: slash
  showHookStatus: true
  compactThinkingLevel: false
  transparent: true
  sessionAccent: true
  leftSegments:
    - pi
    - vim
    - hostname
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - status
    - model
    - mode
    - subagents
    - cost
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
terminal:
  showProgress: true
tui:
  textSizing: true
  codexResetFireworks: false
  tight: false
  scrollbackRebuild: true
  imeSafeCursor: false
  vimMode: false
  vimModeDisplay: text
display:
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: true
  showTurnTime: true
task:
  showResolvedModelBadge: true
  eager: preferred
  isolation:
    commits: generic
    merge: patch
    enabled: true
personality: pragmatic
retry:
  modelFallback: false
  waitForUsageReset: true
advisor:
  enabled: false
interruptMode: wait
followUpMode: one-at-a-time
steeringMode: all
loop:
  mode: reset
doubleEscapeAction: none
error:
  notify: "on"
collab:
  displayName: andyhite
marketplace:
  autoUpdate: auto
startup:
  changelogMode: summary
  quiet: true
features:
  unexpectedStopDetection: mechanical
compaction:
  handoffSaveToDisk: true
  thresholdPercent: 60
  idleEnabled: true
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - shake
    - soft
  idleThresholdTokens: 200000
  idleTimeoutSeconds: 120
ttsr:
  contextMode: discard
  repeatMode: after-gap
memory:
  backend: "off"
autolearn:
  enabled: false
edit:
  mode: hashline
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
lsp:
  formatOnWrite: false
bash:
  autoBackground:
    enabled: true
  direnv: auto
bashInterceptor:
  enabled: true
astGrep:
  enabled: true
computer:
  enabled: true
debug:
  enabled: true
checkpoint:
  enabled: false
github:
  enabled: true
web_search:
  enabled: true
todo:
  eager: preferred
browser:
  relay: false
plan:
  defaultOnStartup: false
  autosave: true
commands:
  enableClaudeUser: true
secrets:
  enabled: true
composer:
  shape: claude
  tokenRate: true
disabledExtensions:
  []
isolation:
  backend: auto
codexResets:
  autoRedeem: unset
defaultThinkingLevel: high
extendedContext: true
tools:
  xdevDocs: catalog
vault:
  enabled: true
expandThinkingBlocks: true