      - cursor/composer-2.5
    plan:
      - cursor/composer-2.5
    slow:
      - cursor/composer-2.5
    task:
      - cursor/composer-2.5
    smol:
      - cursor/composer-2.5
    commit:
      - cursor/composer-2.5
    tiny:
      - cursor/composer-2.5
    vision:
      []
    designer:
      - cursor/composer-2.5
    advisor:
      - cursor/composer-2.5
  usageReservePolicy: confirm
  usageReservePct: 10
advisor:
