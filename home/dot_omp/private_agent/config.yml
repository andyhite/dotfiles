# Anchored so the `anthropic` preset below is this exact block, not a second copy that drifts.
# omp expands the alias into a literal copy whenever it rewrites this file, so a
# /modelpreset switch can't leave the preset pointing at the switched-to roles.
modelRoles: &anthropicRoles
  default: anthropic/claude-sonnet-5-5:medium
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:max
  task: anthropic/claude-sonnet-5-5:low
  smol: anthropic/claude-haiku-4-5:low
  commit: anthropic/claude-haiku-4-5:minimal
  tiny: anthropic/claude-haiku-4-5:minimal
  vision: anthropic/claude-sonnet-5-5:medium
  designer: anthropic/claude-opus-5-5:high
  advisor: anthropic/claude-sonnet-5-5:medium
# A preset switch clears every role it leaves out, so a preset names all of them,
# `designer` included. Only `anthropic` lives here: it needs nothing but the built-in
# subscription login. Presets that depend on per-machine auth (e.g. `openai` on
# openai-codex) go in ~/.omp/agent/config.local.yml; omp lists both files' presets
# together, and a same-named preset there replaces this one whole.
modelPresets:
  anthropic:
    modelRoles: *anthropicRoles
    defaultThinkingLevel: high
modelProviderOrder:
  - anthropic
  - cursor
# omp reads <cwd>/.env on startup with no off switch, so any project that defines
# OPENAI_API_KEY, CEREBRAS_API_KEY, ... silently makes that provider available to
# omp. Disabling the id is the only gate checked before credentials. Kept out:
# anthropic and openai-codex (stored OAuth outranks env keys), cursor, and
# huggingface/openrouter (keys exported in ~/.zshrc.local on purpose). Local
# engines (ollama, lm-studio, llama.cpp, vllm) need no key and stay usable.
# ponytail: hand-kept list of every env-keyed provider in omp 18.4.10; a provider
# omp adds later is not covered until it's added here.
