# Written to ~/.omp/agent/config.local.yml by `chezmoi apply` the first
# time it runs, then never touched again. Mode 0600 already, from the
# source name's `private_` attribute.
# zshrc exports PI_CONFIG_FILES pointing at that copy, which omp layers as a
# CLI config overlay on top of the shared ~/.omp/agent/config.yml (copied from
# dotfiles by chezmoi). The overlay is a deep merge of settings objects: only
# the keys present here override anything — every other setting, including
# untouched modelRoles entries, still comes from the shared config.yml.
#
# This is the file a machine edits to run its own model routing: its fallback
# chains, presets for providers only it authenticates, a trial model, a role
# pointed at a custom provider from ~/.omp/agent/models.yml. The shared file
# carries only anthropic primaries and the `anthropic` preset; it has no
# fallback chains at all, because a chain is only as good as the providers a
# machine has logged into. Until this file sets some, a failing role has no
# other model to move to.
#
# It has to stay a valid object even with nothing overridden: omp validates
# the overlay's root as an object, and PI_CONFIG_FILES pointing at a missing
# or unparsable file is a hard startup error (not skipped like an
# unauthenticated built-in provider). The active `{}` below is what keeps a
# fresh copy inert without being empty.

{}

# ── Example: trial a model on a provider only this machine authenticates ────
# fireworks is one of omp's own built-in providers — authenticate it with
# `/login fireworks` (or a stored/env API key) and reference it directly, no
# models.yml entry needed. A genuinely custom provider (self-hosted, or a
# second identity for an account with its own subscription) does need one —
# see omp/agent/models.yml.example. Either way, comment what a role's
# override replaces so reverting is a one-line diff away.
#
# modelRoles:
#   task: fireworks/kimi-k2.7-code:medium      # was anthropic/claude-sonnet-5-5:low — trial
#   smol: fireworks/minimax-m2.7:low           # was anthropic/claude-haiku-4-5:low

# ── Example: fallback chains and a matching preset ──────────────────────────
# A role's chain is a YAML list, so a higher layer replaces it whole rather
# than appending. A preset must name every role — switching clears the rest —
# and presets here are listed alongside the shared `anthropic` one. This
# machine authenticates the openai-codex subscription, so chains run anthropic
# (primary, from modelRoles) -> openai-codex -> cursor, and an `openai` preset
# makes that middle tier primary. Anchoring each selector once keeps the
# preset and the chains' first tier from drifting apart:
#
# modelPresets:
#   openai:
#     modelRoles:
#       default: &solMedium openai-codex/gpt-6.1-sol:medium
#       plan: &astraHigh openai-codex/gpt-6-astra:high
#       # …every other role, the same way
#     defaultThinkingLevel: high
# retry:
#   fallbackChains:
#     default:
#       - *solMedium
#       - cursor/composer-2.5
#     plan:
#       - *astraHigh
#       - cursor/composer-2.5
