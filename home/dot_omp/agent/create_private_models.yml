# Written to ~/.omp/agent/models.yml by `chezmoi apply` the first time it
# runs, then never touched again — beside the config.yml file, where omp
# already looks for it. This copy is outside the repo and never committed,
# which is the whole point: config.yml is shared by every machine, and this
# is where a machine defines credentials and custom providers that only it
# has — an API key, a self-hosted endpoint, a trial provider not worth
# tracking. Mode 0600 already, from the source name's `private_` attribute.
#
# `modelRoles` and `retry.fallbackChains` in the shared config.yml name only
# omp's built-in provider ids (`anthropic`, `openai-codex`, `openai`,
# `cursor`), so this file starts with nothing to define. A machine that only
# ever uses those four needs no changes here at all — `providers: {}` below
# is the whole file.
#
# For machine-specific *model routing* — which model each role resolves to,
# what a role falls back to on failure — see omp/agent/config.local.yml.example
# instead: it overlays modelRoles/retry.fallbackChains on top of the shared
# config.yml without touching credentials.

providers: {}

# Leave that line as-is on a machine that only authenticates omp's built-in
# providers. It has to stay: omp validates the root as an object, so a file
# of pure comments parses as null and prints, on every single startup:
#
#   Failed to load config file models, Schema error: root: must be an object (was null)


# ── A custom provider: self-hosted, or a second identity for an account that
# already has a subscription ──────────────────────────────────────────────
# Reference it from omp/agent/config.local.yml.example as `<id>/<model>`. It
# exists only on machines that define it here; an undefined reference in that
# local overlay warns once per role at every startup instead of failing
# outright.
#
# providers:
#   vllm-local:
#     baseUrl: http://localhost:8000/v1
#     api: openai-completions
#     auth: none
#     headers:
#       Authorization: "!sh -c '. \"$HOME/.omp/agent/.env\"; printf \"Bearer %s\" \"$VLLM_API_KEY\"'"
#     models:
#       - id: qwen3-coder-30b
#         name: Qwen3 Coder 30B (local)
#         reasoning: true
#         input: [text]
#         contextWindow: 128000
#         maxTokens: 32000
#
# `auth: none` skips the normal credential lookup so the explicit header is
# what authenticates. The `!` resolver sources the dotenv file itself:
# command resolvers do not inherit values loaded by omp's own dotenv loader,
# so `!printenv VLLM_API_KEY` resolves to nothing for a key that lives only
# in ~/.omp/agent/.env. A secret store can replace the shell command
# outright:
#
#   Authorization: "!op read op://work/vllm/api-key"
#
# The same shape covers a second identity for a provider that already has a
# built-in id (e.g. billing Anthropic by API key on a machine that also runs
# a subscription `/login anthropic`) — a custom provider id doesn't inherit
# the built-in one's catalog, so every model referenced from config.local.yml
# needs its own entry here.
#
# Verify with a live model request rather than trusting `omp models` alone;
# `auth: none` keeps the provider selectable even when the header command
# fails.


# ── Overriding a built-in provider's credential ──────────────────────────────
# A stored OAuth session outranks every environment variable in omp's
# credential order, so exporting e.g. OPENAI_API_KEY on a box that has ever
# run `/login openai-codex` does nothing for the subscription id — the
# subscription keeps paying, silently. Pin the built-in id's credential
# directly instead of introducing a second identity for it:
#
# providers:
#   openai:
#     apiKey: "!sh -c '. \"$HOME/.omp/agent/.env\"; printf %s \"$OPENAI_API_KEY\"'"
#
# This only works when nothing else on the machine needs the built-in id's
# other credential (e.g. the subscription login) at the same time — a
# provider id holds exactly one credential. Two credit tiers for the same
# upstream account (subscription and API key both wanted, in that order) need
# two distinct provider ids instead; see the custom-provider pattern above.
