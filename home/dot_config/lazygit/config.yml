# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# Lazygit's config location is platform-specific. install.sh links this file to
# ~/.config/lazygit/config.yml on Linux and to the native Application Support
# path on macOS.

gui:
  # The tracked Ghostty and Nerd Font setup provides v3 glyphs everywhere this
  # config is installed.
  nerdFontsVersion: "3"
  filterMode: fuzzy
  showRandomTip: false
  # GitHub Dark Default, shared with Ghostty, starship, herdr's accent, atuin,
  # btop, hunk, delta, and nvim. The focused border uses `#58a6ff` — ANSI 4,
  # the theme's normal blue — the same accent value Ghostty renders and
  # nested TUIs (Zed, herdr) agree on for the active-pane accent.
  theme:
    activeBorderColor:
      - "#58a6ff"
      - bold
    inactiveBorderColor:
      - "#b1bac4"
    searchingActiveBorderColor:
      - "#3fb950"
      - bold
    optionsTextColor:
      - "#58a6ff"
    selectedLineBgColor:
      - "#161b22"
    inactiveViewSelectedLineBgColor:
      - "#21262d"
    unstagedChangesColor:
      - "#ff7b72"
    defaultFgColor:
      - "#e6edf3"
git:
  # Delta, not hunk, and this is one of only two places delta survives (the
  # other is gitconfig's `add -p` diffFilter). Lazygit captures a renderer's
  # stdout into a scrollable panel, so the renderer has to be a stream filter;
  # hunk is a full-screen TUI and would fight lazygit for raw terminal input
  # rather than render into the panel. Delta reads gitconfig's [delta] section
  # directly (it walks up to the repo's .git), so nothing is duplicated here —
  # including `syntax-theme = none`, which is why this panel shows plus/minus
  # backgrounds against the terminal foreground rather than a syntax palette.
  diffRenderers:
    - # Forces color even though lazygit captures delta's output into a panel
      # instead of a real terminal — without this, delta (like git) detects a
      # non-tty stdout and drops color, and the diff panel goes plain-text.
      colorArg: always
      # `--paging=never` is load-bearing: lazygit already scrolls the diff panel
      # itself, and a delta that also pages internally (spawns its own `less`)
      # fights it for raw terminal input — deadlocking the panel instead of just
      # failing loudly. `--dark` picks delta's dark palette; everything else
      # (syntax-theme, line-numbers) comes from gitconfig's
      # [delta] section. Deliberately no `|| less` fallback like gitconfig's
      # core.pager: lazygit shells this differently, and a missing delta
      # degrades to an error inside one panel instead of breaking every git
      # command outside lazygit too — not worth the noise of guarding it here.
      command: delta --dark --paging=never
os:
  # install.sh provides nvim on both macOS and Linux.
  editPreset: nvim
