# hunk (npm hunkdiff, brew formula `hunk`) is this machine's git pager and
# difftool: gitconfig points core.pager at `hunk pager || less` and diff.tool at
# `hunk`, so `git diff` / `git show` / `git difftool` all open the review UI
# here, and the `git review` alias (`!hunk diff`) covers a whole changeset in
# one stream. Settings below therefore apply to ordinary git diffing, not just
# to direct `hunk diff` / `hunk show` / `hunk patch` invocations.

# github-dark-default is hunk's exact built-in Shiki theme id, matching
# Ghostty, starship, atuin, btop, herdr, lazygit, Zed, and omp. delta cannot
# match it at all — no dark GitHub syntax theme exists in delta's bundle, so
# it runs `syntax-theme = none` in the two surfaces it still owns (`add -p`,
# lazygit's panel). NvChad needs a hand-written custom theme because base46
# bundles only the legacy GitHub Dark palette (`#24292E`), not Dark Default's
# `#0d1117`.
theme = "github-dark-default"

# Line numbers in the gutter, matching gitconfig's [delta] line-numbers = true
# so the two surfaces delta still owns (`add -p`, lazygit's panel) keep the same
# gutter as every diff hunk renders.
line_numbers = true

# This machine's diffs are read almost entirely as agent-authored changesets
# (Claude/omp sessions, `hunk diff --watch` open in a side pane while an
# agent works) rather than hand-written patches, so the inline agent-notes
# rail earns its screen space by default instead of staying opt-in.
agent_notes = true

# Ghostty (config/ghostty/config) sets no background-opacity — it renders a
# fully opaque canvas — so letting it show through would just repaint hunk's
# own themed background with itself. Explicit rather than relying on the
# false default so the reasoning survives a future Ghostty transparency change.
transparent_background = false
